<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bocetos de Robots ARC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: banco de trabajo en tres columnas — lista de armas | visor 3D | ficha técnica. En móvil se apila. */
:root{
  --bg:#efe8d8;          /* papel */
  --panel:#f7f2e6;
  --ink:#1e1e1c;
  --muted:#5f5e5a;
  --line:#1e1e1c;
  --stage-a:#f7f2e6;
  --stage-b:#e2d9c4;
  --sig-red:#d8442e;
  --sig-yel:#f2b33d;
  --sig-teal:#2e8c86;
  --chip:#efe8d8;
  --focus:#2e8c86;
  --f-display:"Space Grotesk",system-ui,sans-serif;
  --f-body:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 16px}
.stripe{height:6px;margin-inline:-16px;background:linear-gradient(90deg,var(--sig-red) 0 33.3%,var(--sig-yel) 33.3% 66.6%,var(--sig-teal) 66.6%)}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px 12px}
header h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,38px);letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:13px;max-width:52ch}
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 270px;gap:14px;height:calc(100% - 92px);min-height:520px}
/* lista */
nav.list{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:auto;padding:8px 0}
.grp{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 14px 4px}
.wbtn{display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;border:0;background:none;color:var(--ink);text-align:left;padding:6px 14px;cursor:pointer;font:inherit}
.wbtn .n{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.02em}
.wbtn .c{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.wbtn:hover{background:var(--chip)}
.wbtn[aria-current="true"]{background:var(--ink);color:var(--panel)}
.wbtn[aria-current="true"] .c{color:inherit;opacity:.75}
.wbtn:focus-visible,.tool:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
/* visor */
.stage{position:relative;border-radius:6px;overflow:hidden;background:radial-gradient(120% 90% at 50% 35%,var(--stage-a),var(--stage-b));border:1px solid var(--line);min-height:360px}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.tag{position:absolute;left:18px;top:14px;pointer-events:none}
.tag .cls{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tag .big{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,6vw,64px);line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.tag .alias{font-size:13px;color:var(--muted)}
.serial{position:absolute;right:16px;top:16px;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right;pointer-events:none}
.toolbar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tool{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 13px var(--f-body);padding:7px 12px;border-radius:4px;cursor:pointer}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.callsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.callsvg polyline{fill:none;stroke:var(--ink);stroke-width:1.2;opacity:.8}.callsvg circle.halo{display:none}.callsvg circle{fill:var(--sig-red);stroke:var(--panel);stroke-width:1.5}
.hot{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--panel);background:var(--sig-red);padding:0;cursor:pointer;pointer-events:auto;box-shadow:0 0 0 1px rgba(200,69,44,.35);will-change:transform}
.hot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--sig-red);opacity:.6;animation:hp 2s ease-out infinite}
.hot.gold{background:var(--sig-yel)}.hot.gold::after{border-color:var(--sig-yel)}.hot.ammo{background:var(--sig-teal)}.hot.ammo::after{border-color:var(--sig-teal)}
.hot.on{box-shadow:0 0 0 3px var(--ink)}.hot:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
@keyframes hp{from{transform:scale(.6);opacity:.8}to{transform:scale(1.4);opacity:0}}
#calls{position:absolute;inset:0;pointer-events:none}
.call{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--sig-red);border-radius:3px;padding:3px 8px 4px;white-space:nowrap;transform:translate(-50%,-50%)}
.call b{display:block;font:600 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.call span{font:600 14px var(--f-display);letter-spacing:.02em}
.call i{display:block;height:3px;background:var(--line);margin-top:3px;width:70px}.call i::after{content:"";display:block;height:100%;width:var(--v);background:var(--ink)}
.call.ammo{border-left-color:var(--sig-yel)}
.slide{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:13px}
.slide input{width:110px;accent-color:var(--sig-red)}
.hint{margin-left:auto;font-size:12px;color:var(--muted)}
/* ficha */
aside.spec{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;overflow:auto;min-width:0}
.spec h2{font-family:var(--f-display);font-weight:700;font-size:26px;text-transform:uppercase;margin:0;line-height:1}
.spec .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-size:12.5px}
.spec ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:14px}
.sw{display:flex;gap:6px;margin-top:4px}
.sw span{width:26px;height:26px;border-radius:3px;border:1px solid var(--line)}
.note{font-size:12.5px;color:var(--muted);margin-top:18px;border-top:1px dashed var(--line);padding-top:10px}

.hot.info{background:var(--sig-teal)}.hot.info::after{border-color:var(--sig-teal)}
.hot.weak{background:var(--sig-red)}.hot.weak::before{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;border-radius:50%;background:var(--panel)}
.hot.back{opacity:.38}.hot.back::after{animation:none;opacity:0}
.call.weak{border-left-color:var(--sig-red)}.call.info{border-left-color:var(--sig-teal)}
.call em{display:block;white-space:normal;width:max-content;max-width:230px;font-style:normal;font-size:12.5px;line-height:1.3;color:var(--muted);margin-top:3px}
.spec ul.wk{list-style:none;padding:0;gap:7px}
.spec ul.wk li{font-size:13.5px;line-height:1.35}
.wkb{font:600 13.5px var(--f-body);color:var(--ink);background:none;border:0;border-bottom:1.5px solid var(--sig-red);padding:0;cursor:pointer}
.wkb:hover{color:var(--sig-red)}.wkb:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.spec ul.wk small{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:14px;height:14px;border-radius:3px;border:1px solid var(--line)}
.prelim{margin:10px 0 0;font-size:12.5px;padding:6px 8px;border-left:3px solid var(--sig-yel);background:var(--chip)}
.note a{color:inherit}
.kv{grid-template-columns:104px minmax(0,1fr)}.kv dd{text-align:left;font-family:var(--f-body);font-size:13px;line-height:1.35}
@media (max-width:980px){
  body{height:auto}
  .app{grid-template-columns:1fr;height:auto}
  nav.list{order:2;display:flex;overflow-x:auto;padding:8px;gap:6px}
  nav.list .grp{display:none}
  .wbtn{flex:0 0 auto;border:1px solid var(--line);border-radius:4px;width:auto}
  .wbtn .c{display:none}
  .stage{order:1;height:62vh;min-height:340px}
  aside.spec{order:3}
  .hint{display:none}
}


/* Estilo de los bocetos de ARC Atlas: bordes de tinta de 1,5 px y esquinas de 4 px */
nav.list,aside.spec,.stage{border:1.5px solid var(--ink)!important;border-radius:4px!important}
.tool,.slide,.call,.wbtn,.mod{border-radius:4px}
.tool,.slide{border:1.5px solid var(--ink)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
header h1,.tag .big,.spec h2,.wbtn .n{text-transform:none;letter-spacing:-.02em}
.wbtn[aria-current="true"]{background:var(--ink);color:var(--bg)}
.wbtn[aria-current="true"] .c{color:var(--bg)}
.grp::before{content:"— "}
.stage{background:radial-gradient(120% 90% at 50% 35%,var(--stage-a),var(--stage-b))}
.arc-return{display:flex;align-items:center;gap:12px;min-height:36px;margin-inline:-16px;padding:0 16px;background:var(--panel);border-bottom:1.5px solid var(--ink);font:500 13px var(--f-body)}
.arc-return a{color:var(--ink);text-decoration:none}
.arc-return a:hover{text-decoration:underline}
.arc-return span{margin-left:auto;font:11px var(--f-mono);letter-spacing:.08em;color:var(--muted)}
/* Modo dentro de la ficha (?embed): sin encabezado ni lista */
html.embed,html.embed body{height:100%!important;overflow:hidden}
html.embed body{padding:0}
html.embed .app{height:100%!important}
html.embed .stripe,html.embed header,html.embed nav.list,html.embed .arc-return{display:none}
html.embed .app{grid-template-columns:minmax(0,1fr) 270px;height:100%;min-height:0;gap:10px}
html.embed .hint{display:none}
html.embed .stage{height:auto;min-height:0;order:0}
html.embed aside.spec{order:0;overflow:auto;min-height:0}
@media (max-width:760px){html.embed .app{grid-template-columns:1fr;grid-template-rows:400px minmax(0,1fr);height:100%}html.embed .stage{height:auto;min-height:0}html.embed aside.spec{order:3;overflow:auto}}
/* Modo miniatura (?thumb): solo el modelo, sin interfaz */
html.thumb,html.thumb body{background:transparent!important;padding:0}
html.thumb .stripe,html.thumb header,html.thumb nav.list,html.thumb aside.spec,html.thumb .arc-return,html.thumb .toolbar,html.thumb .tag,html.thumb .serial,html.thumb #calls,html.thumb .callsvg{display:none!important}
html.thumb .app{display:block;height:100%}
html.thumb .stage{height:100%;border:0!important;background:transparent!important}

@media (prefers-reduced-motion:reduce){*{transition:none!important}.hot::after{animation:none}}
</style>
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<div class="stripe"></div>
<!-- ARC ATLAS RETURN BAR START -->
<nav class="arc-return" aria-label="Volver a la wiki"><a href="./">← Volver a ARC Atlas</a><span>robots en 3d</span></nav>

<header>
  <h1>Bocetos de Robots ARC</h1>
  <p>27 máquinas ARC en 3D con sus puntos débiles marcados. Diseños originales según lo que hace cada una. Arrastrá para girar, rueda o pellizco para acercar.</p>
</header>
<div class="app">
  <nav class="list" id="list" aria-label="Robots ARC"></nav>
  <section class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="tag"><div class="cls" id="tCls"></div><div class="big" id="tName"></div><div class="alias" id="tAlias"></div></div>
    <div class="serial" id="tSerial"></div>
    <svg class="callsvg" id="callsvg" aria-hidden="true"></svg><div id="calls"></div>
    <div class="toolbar">
      <button class="tool" id="bRot" aria-pressed="true">Girar</button>
      <button class="tool" id="bSketch" aria-pressed="false">Modo boceto</button>
      <button class="tool" id="bData" aria-pressed="true">Datos</button>
      <button class="tool" id="bMan" aria-pressed="false">Escala humana</button>
      <label class="slide" for="sExp" id="expWrap">Abrir blindaje <input id="sExp" type="range" min="0" max="100" value="0"></label>
      <button class="tool" id="bFit">Reencuadrar</button>
      <span class="hint">Rojo: punto débil · verde: dato · ← → cambian de robot</span>
    </div>
  </section>
  <aside class="spec" id="spec"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const TAU=Math.PI*2;
/* ---------- texturas procedurales ---------- */
function canvasTex(w,h,draw,srgb=true){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;
}
function rnd(s){return function(){s=(s*16807)%2147483647;return (s-1)/2147483646}}
const R0=rnd(1234);
const GRIME=canvasTex(512,512,(x,w,h)=>{
  x.fillStyle='#ececec';x.fillRect(0,0,w,h);
  for(let i=0;i<5000;i++){const v=200+R0()*55|0;x.fillStyle=`rgba(${v-40},${v-42},${v-46},${.25*R0()})`;x.fillRect(R0()*w,R0()*h,1+R0()*3,1+R0()*3)}
  x.lineCap='round';
  for(let i=0;i<70;i++){x.strokeStyle=`rgba(255,255,255,${.25+R0()*.35})`;x.lineWidth=.6+R0();const a=R0()*w,b=R0()*h;x.beginPath();x.moveTo(a,b);x.lineTo(a+(R0()-.5)*60,b+(R0()-.5)*20);x.stroke()}
  for(let i=0;i<14;i++){const g=x.createRadialGradient(0,0,0,0,0,40+R0()*60);g.addColorStop(0,'rgba(90,80,60,.16)');g.addColorStop(1,'rgba(90,80,60,0)');x.save();x.translate(R0()*w,R0()*h);x.fillStyle=g;x.fillRect(-120,-120,240,240);x.restore()}
});
GRIME.repeat.set(3,3);
const CLEAN=canvasTex(256,256,(x,w,h)=>{x.fillStyle='#e6e6e6';x.fillRect(0,0,w,h);for(let i=0;i<2500;i++){const v=218+R0()*30|0;x.fillStyle=`rgba(${v},${v},${v},.5)`;x.fillRect(R0()*w,R0()*h,1,1)}});CLEAN.repeat.set(4,4);
const WOOD=canvasTex(512,256,(x,w,h)=>{
  x.fillStyle='#d9b48a';x.fillRect(0,0,w,h);
  for(let i=0;i<90;i++){x.strokeStyle=`rgba(${70+R0()*40|0},${40+R0()*20|0},20,${.12+R0()*.25})`;x.lineWidth=.6+R0()*2.2;x.beginPath();let y=R0()*h;x.moveTo(0,y);for(let s=0;s<=w;s+=32){y+=(R0()-.5)*6;x.lineTo(s,y)}x.stroke()}
});
WOOD.repeat.set(4,4);
function normalTex(size,drawH,rep,strength){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');drawH(x,size);
  const src=x.getImageData(0,0,size,size).data,out=x.createImageData(size,size),o=out.data,h=(i,j)=>src[(((j+size)%size)*size+((i+size)%size))*4]/255;
  for(let j=0;j<size;j++)for(let i=0;i<size;i++){const dx=(h(i-1,j)-h(i+1,j))*strength,dy=(h(i,j-1)-h(i,j+1))*strength,l=Math.hypot(dx,dy,1),k=(j*size+i)*4;
    o[k]=(dx/l*.5+.5)*255;o[k+1]=(dy/l*.5+.5)*255;o[k+2]=(1/l*.5+.5)*255;o[k+3]=255}
  x.putImageData(out,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.anisotropy=8;return t}
const NRM_FINE=normalTex(256,(x,n)=>{x.fillStyle='#808080';x.fillRect(0,0,n,n);for(let i=0;i<9000;i++){const v=110+R0()*40|0;x.fillStyle=`rgb(${v},${v},${v})`;x.fillRect(R0()*n,R0()*n,1.4,1.4)}
  x.strokeStyle='rgba(95,95,95,.6)';for(let i=0;i<40;i++){x.lineWidth=.5;const a=R0()*n,b=R0()*n;x.beginPath();x.moveTo(a,b);x.lineTo(a+(R0()-.5)*50,b+(R0()-.5)*12);x.stroke()}},1,1.6);
const NRM_STIP=normalTex(128,(x,n)=>{x.fillStyle='#606060';x.fillRect(0,0,n,n);for(let j=0;j<16;j++)for(let i=0;i<16;i++){const g=x.createRadialGradient(i*8+4+(j%2)*4,j*8+4,0,i*8+4+(j%2)*4,j*8+4,3.4);g.addColorStop(0,'#e0e0e0');g.addColorStop(1,'#606060');x.fillStyle=g;x.beginPath();x.arc(i*8+4+(j%2)*4,j*8+4,3.4,0,TAU);x.fill()}},90,2.4);
const NRM_WOOD=normalTex(256,(x,n)=>{x.fillStyle='#808080';x.fillRect(0,0,n,n);for(let i=0;i<70;i++){x.strokeStyle=`rgba(${R0()<.5?60:170},${R0()<.5?60:170},${R0()<.5?60:170},.35)`;x.lineWidth=.6+R0()*1.6;x.beginPath();let y=R0()*n;x.moveTo(0,y);for(let s=0;s<=n;s+=16){y+=(R0()-.5)*3;x.lineTo(s,y)}x.stroke()}},1,1.2);


/* ---------- estado de construcción ---------- */
let G=null,P=null,MATS=[];
function lin(c){return new THREE.Color(c).convertSRGBToLinear()}
function mat(color,rough,metal,extra={}){const phys=extra.clearcoat!=null;const C=phys?THREE.MeshPhysicalMaterial:THREE.MeshStandardMaterial;const m=new C(Object.assign({color:lin(color),roughness:rough,metalness:metal},extra));MATS.push(m);return m}
/* Código de colores de los bocetos: blanco mate = chapa común, gris oscuro brillante = blindaje pesado,
   amarillo mate = punto débil, rojo/naranja encendido = núcleo. */
function makePal(c){
  const glow=c.glow||'#79e8ff',T=CLEAN,nv=v=>new THREE.Vector2(v,v),core=c.core||'#ff4b2b';
  return {
    body:mat(c.body||'#e4ded0',.62,.12,{map:T,roughnessMap:T,normalMap:NRM_FINE,normalScale:nv(.35),clearcoat:.08,clearcoatRoughness:.6}),
    body2:mat(c.body2||'#34383d',.6,.35,{map:T,roughnessMap:T,normalMap:NRM_FINE,normalScale:nv(.4)}),
    accent:mat(c.accent||'#d8452a',.55,.12,{map:T,roughnessMap:T,normalMap:NRM_FINE,normalScale:nv(.3)}),
    heavy:mat(c.heavy||'#5f656c',.34,.55,{map:T,roughnessMap:T,normalMap:NRM_FINE,normalScale:nv(.3),clearcoat:.35,clearcoatRoughness:.3}),
    metal:mat(c.metal||'#3a3e43',.38,.82,{map:T,roughnessMap:T,normalMap:NRM_FINE,normalScale:nv(.25),clearcoat:.12,clearcoatRoughness:.4}),
    steel:mat('#a3a8ad',.26,.95,{normalMap:NRM_FINE,normalScale:nv(.15)}),
    dark:mat('#121314',.9,.05),
    rubber:mat('#1b1c1d',.92,0,{normalMap:NRM_STIP,normalScale:nv(.9)}),
    weak:mat(c.weak||'#e9b532',.86,.04,{map:T,normalMap:NRM_STIP,normalScale:nv(.35)}),
    core:mat(core,.4,0,{emissive:lin(core),emissiveIntensity:2.6}),
    glow:mat(glow,.4,0,{emissive:lin(glow),emissiveIntensity:2.4}),
    red:mat('#ff3b2f',.4,0,{emissive:lin('#ff3b2f'),emissiveIntensity:3.2}),
    glass:mat(c.glass||'#9cc6d2',.04,.1,{transparent:true,opacity:.35,clearcoat:1,clearcoatRoughness:.05}),
    cable:mat('#2a2b2c',.7,.2),
    brass:mat('#c19443',.3,.95),
  };
}
let TAGS=[];function T(...t){TAGS=t}

  const sz=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),hx=Math.max(sz.x,sz.z);
  const vf=camera.fov*Math.PI/180,hf=2*Math.atan(t*camera.aspect),rad=sz.length()/2;
  const dist=Math.max(rad/Math.sin(Math.min(vf,hf)/2)*.9,sz.y*1.9/(2*t));
  controls.target.copy(c);
  camera.position.copy(c).add(VIEW.clone().multiplyScalar(dist));

}
function applySketch(){
  if(!current)return;closeHL();
  current.children.forEach(o=>{
    if(o.userData.decal||o.userData.fx){o.visible=!sketch&&(!o.userData.open||explode>.3);return}
    if(!o.userData.orig)o.userData.orig=o.material;
    o.material=sketch?paper:o.userData.orig;
    if(sketch&&!o.userData.edges){const e=new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry,28),ink);o.add(e);o.userData.edges=e}
    if(o.userData.edges)o.userData.edges.visible=sketch;
  });
}
/* «abrir blindaje»: las placas se separan hacia afuera y queda a la vista lo que tapan */
function applyExplode(){if(!current||!dims)return;const L=Math.max(dims.x,dims.y,dims.z)/scaleK;
  current.children.forEach(o=>{const b=o.userData.base;if(!b)return;const tg=o.userData.tags||[];
    if(o.userData.open)o.visible=!sketch&&explode>.3;
    if(!tg.includes('armor')){o.position.copy(b);return}
    let v;if(o.userData.ex)v=new THREE.Vector3(...o.userData.ex).multiplyScalar(.65);else{v=o.userData.ctr.clone();if(v.length()<1e-6)v.set(0,1,0);v.normalize().multiplyScalar(.17)}
    o.position.copy(b).add(v.multiplyScalar(L*explode))});
  const dir=camera.position.clone().sub(controls.target).normalize();camera.position.copy(controls.target).add(dir.multiplyScalar(fitDist*(1+explode*.25)))}
function makeAnchors(d,sz){const A=[],rc=new THREE.Raycaster(),R=sz.length();
  (d.pts||[]).forEach(pt=>{const ms=G.children.filter(o=>o.isMesh&&!o.userData.decal&&(o.userData.tags||[]).includes(pt.t));if(!ms.length)return;
    let best=ms[0],bv=-1e9;ms.forEach(o=>{const c=o.userData.ctr,v=c.clone().normalize().dot(pt.dir?V(pt.dir).normalize():VIEW)+c.y/R*.2;if(v>bv){bv=v;best=o}});
    const c=best.userData.ctr.clone();let dir=pt.dir?V(pt.dir).normalize():c.clone();if(dir.length()<1e-6)dir=VIEW.clone();dir.normalize();
    rc.set(c.clone().add(dir.clone().multiplyScalar(R)),dir.clone().negate());const h=rc.intersectObject(best,false)[0];

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}

/* ---------- interfaz ---------- */
const list=document.getElementById('list'),spec=document.getElementById('spec');

    b.innerHTML=`<span class="n">${d.name}</span><span class="c">${d.cls}</span>`;b.onclick=()=>select(i);list.appendChild(b);btns[i]=b})});
const navOrder=[];ORDER.forEach(g=>DEFS.forEach((d,i)=>{if(d.group===g)navOrder.push(i)}));

const sExp=document.getElementById('sExp'),expWrap=document.getElementById('expWrap');

  const weak=(d.pts||[]).filter(p=>p.k==='weak'),wl=weak.length?`<ul class="wk">${weak.map(p=>`<li><button type="button" class="wkb" data-t="${p.t}">${esc(p.n)}</button>${p.fx?` — ${esc(p.fx)}`:''}${p.hid?' <small>(tapado por el blindaje)</small>':''}</li>`).join('')}</ul>`:`<p style="margin:0;font-size:14px">${esc(d.noWeak||'Sin puntos débiles confirmados todavía.')}</p>`;

  spec.innerHTML=`<h2>${esc(d.name)}</h2><div style="color:var(--muted);font-size:13.5px">${esc(d.cls)}${d.alias?' · '+esc(d.alias):''}</div>
  ${d.prelim?'<p class="prelim">Datos preliminares: llegó con Frozen Trail el 8 de octubre y la comunidad todavía los está confirmando.</p>':''}
  <div class="k">Qué hace</div><p style="margin:0;font-size:14.5px">${esc(d.desc)}</p>
  <div class="k">Ficha</div>
  <dl class="kv">${row('Tipo',d.mode)}${row('Tamaño estimado',d.size)}${row('Blindaje',d.armor)}${row('Vida',d.hp)}${row('Ataque',d.atk)}${row('Botín',d.loot)}</dl>

  <div class="k">Código de colores</div><div class="legend"><span><i style="background:#e9b532"></i>Punto débil</span><span><i style="background:#4a4f55"></i>Blindaje pesado</span><span><i style="background:#e4ded0"></i>Chapa común</span><span><i style="background:#ff4b2b"></i>Núcleo</span></div>
  <p class="note">Diseño original pensado según lo que hace cada máquina, no una copia del modelo del juego. Puntos débiles según ${d.src.map(u=>`<a href="${u}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\/(www\.)?/,'').split('/')[0])}</a>`).join(', ')}. Tamaños estimados para el boceto.</p>`;
  spec.querySelectorAll('.wkb').forEach(b=>b.onclick=()=>openTag(b.dataset.t));
  try{localStorage.setItem('robots-w',d.id)}catch(e){}
}
function openTag(t){const i=ANCH.findIndex(a=>a.t===t);if(i<0)return;if(ANCH[i].hid&&explode<.3){explode=1;sExp.value=100;applyExplode()}if(!showData){showData=true;bData.setAttribute('aria-pressed','true')}OPEN=i;fillCall()}
const bRot=document.getElementById('bRot'),bSk=document.getElementById('bSketch'),bMan=document.getElementById('bMan');
bRot.onclick=()=>{controls.autoRotate=!controls.autoRotate;bRot.setAttribute('aria-pressed',controls.autoRotate)};
bSk.onclick=()=>{sketch=!sketch;bSk.setAttribute('aria-pressed',sketch);applySketch()};
bMan.onclick=()=>{showMan=!showMan;man.visible=showMan;bMan.setAttribute('aria-pressed',showMan);fit();applyExplode()};
sExp.oninput=()=>{explode=sExp.value/100;applyExplode()};
document.getElementById('bFit').onclick=()=>{fit();applyExplode()};
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||document.documentElement.classList.contains('embed'))return;const p=navOrder.indexOf(curIdx);
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();select(navOrder[(p+1)%navOrder.length]);btns[curIdx].focus()}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();select(navOrder[(p-1+navOrder.length)%navOrder.length]);btns[curIdx].focus()}});
if(reduce){controls.autoRotate=false;bRot.setAttribute('aria-pressed','false')}

const svg=document.getElementById('callsvg'),callBox=document.getElementById('calls');let showData=true,OPEN=-1,HOTS=[],callEl=null,HLON=null;const _v=new THREE.Vector3();
function setupHots(){OPEN=-1;HLON=null;callBox.innerHTML='';svg.innerHTML='';HOTS=ANCH.map((a,i)=>{const b=document.createElement('button');b.className='hot '+(a.k==='weak'?'weak':'info');
    b.setAttribute('aria-label',(a.k==='weak'?'Punto débil: ':'')+a.n);b.title=a.n;b.onclick=e=>{e.stopPropagation();OPEN=OPEN===i?-1:i;fillCall()};callBox.appendChild(b);return b});
  callEl=document.createElement('div');callEl.className='call';callEl.hidden=true;callBox.appendChild(callEl)}
function closeHL(){if(HLON){HLON.forEach(o=>{if(o.userData.hlOrig){o.material=o.userData.hlOrig;delete o.userData.hlOrig}});HLON=null}}
function fillCall(){HOTS.forEach((b,i)=>b.classList.toggle('on',i===OPEN));closeHL();if(OPEN<0||!ANCH[OPEN]){callEl.hidden=true;svg.innerHTML='';return}
  const a=ANCH[OPEN];callEl.className='call '+(a.k==='weak'?'weak':'info');
  callEl.innerHTML=a.k==='weak'?`<b>Punto débil</b><span>${esc(a.n)}</span>${a.fx?`<em>${esc(a.fx)}</em>`:''}`:`<b>${esc(a.n)}</b><span>${esc(a.v||'')}</span>${a.fx?`<em>${esc(a.fx)}</em>`:''}`;callEl.hidden=false;
  if(a.k==='weak'&&!sketch){HLON=a.group;HLON.forEach(o=>{o.userData.hlOrig=o.material;o.material=HL})}}
let frame=0;const rcO=new THREE.Raycaster();
function updateCalls(){
  const vis=current&&showData&&!sketch;callBox.hidden=!vis;svg.style.display=vis?'':'none';if(!vis)return;
  const W=stage.clientWidth,H=stage.clientHeight;current.updateMatrixWorld();const occl=(frame++%6)===0,targets=occl?meshesOf(current):null;
  const cen=new THREE.Vector3();current.localToWorld(cen);cen.project(camera);const cx=(cen.x+1)/2*W,cy=(1-cen.y)/2*H;
  ANCH.forEach((a,i)=>{const b=HOTS[i];if(!b)return;const hide=a.hid&&explode<.3;
    _v.copy(a.local);a.mesh.localToWorld(_v);
    if(occl&&!hide){const dirv=_v.clone().sub(camera.position),dist=dirv.length();rcO.set(camera.position,dirv.normalize());const h=rcO.intersectObjects(targets,false)[0];
      b.classList.toggle('back',!!h&&h.distance<dist-dims.x*.01&&!a.group.includes(h.object))}
    _v.project(camera);
    if(hide||_v.z>1){b.hidden=true;if(OPEN===i){OPEN=-1;fillCall()}return}
    const x=(_v.x+1)/2*W,y=(1-_v.y)/2*H;b.hidden=false;b.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
    if(i===OPEN){let dx=x-cx,dy=y-cy;const n=Math.hypot(dx,dy)||1;dx/=n;dy/=n;const sx=dx>=0?1:-1;
      let lx=x+dx*100+sx*80,ly=y+dy*80-(Math.abs(dy)<.3?50:0);lx=Math.min(W-125,Math.max(125,lx));ly=Math.min(H-90,Math.max(lx<380?175:96,ly));
      callEl.style.left=lx+'px';callEl.style.top=ly+'px';const ex=lx-sx*120,ex2=lx-sx*108;
      svg.innerHTML=`<polyline points="${x.toFixed(1)},${y.toFixed(1)} ${ex.toFixed(1)},${ly.toFixed(1)} ${ex2.toFixed(1)},${ly.toFixed(1)}"/>`}})}
let pd=null;cv.addEventListener('pointerdown',e=>{pd=[e.clientX,e.clientY]});cv.addEventListener('pointerup',e=>{if(pd&&Math.hypot(e.clientX-pd[0],e.clientY-pd[1])<5&&OPEN>=0){OPEN=-1;fillCall()}pd=null});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&OPEN>=0){OPEN=-1;fillCall()}});
const bData=document.getElementById('bData');bData.onclick=()=>{showData=!showData;bData.setAttribute('aria-pressed',showData)};
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;controls.update();
  if(current&&!reduce){current.children.forEach(o=>{const s=o.userData.spin;if(s)o.rotation[s.axis]+=s.v*dt});
    if(DEFS[curIdx].fly)current.position.y=current.userData.baseY+Math.sin(t*1.2)*dims.y*.025}
  HL.emissiveIntensity=reduce?.7:.55+.35*Math.sin(t*5);
  updateCalls();renderer.render(scene,camera)}
function start(){
  if(document.documentElement.classList.contains("thumb")){controls.autoRotate=false;showData=false;grid.visible=false;const f0=fit;fit=function(){f0();const r=dims?dims.x/Math.max(dims.y,.001):1,flat=dims&&dims.z/dims.x>.6,k=r>1.6&&flat?1.05:r>2.6?.96:r>1.6?.8:.62;fitDist*=k;camera.position.lerp(controls.target,1-k);controls.update()}}
  resize();let id=null;const h=(location.hash||'').slice(1);try{if(!document.documentElement.classList.contains('embed'))id=localStorage.getItem('robots-w')}catch(e){}
  let i=DEFS.findIndex(d=>d.id===h);if(i<0)i=DEFS.findIndex(d=>d.id===id);if(i<0)i=navOrder[0];
  select(i);loop();
}
const fontReady=document.fonts&&document.fonts.load?Promise.race([document.fonts.load('600 96px "Saira Condensed"'),new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
fontReady.then(start,start);
window.addEventListener('hashchange',()=>{const i=DEFS.findIndex(d=>d.id===location.hash.slice(1));if(i>=0)select(i)});
/* encuadre ajustado para las miniaturas: el modelo ocupa casi todo el cuadro */
function tight(m=.84){if(!current)return;const b=new THREE.Box3();current.updateMatrixWorld(true);meshesOf(current).forEach(o=>b.expandByObject(o));
  const C=b.getCenter(new THREE.Vector3()),dir=camera.position.clone().sub(controls.target).normalize(),pts=[];
  for(const x of[b.min.x,b.max.x])for(const y of[b.min.y,b.max.y])for(const z of[b.min.z,b.max.z])pts.push(new THREE.Vector3(x,y,z));
  const ext=d=>{camera.position.copy(C).add(dir.clone().multiplyScalar(d));camera.lookAt(C);camera.updateMatrixWorld(true);let mx=0;
    for(const p of pts){const q=p.clone().project(camera);if(q.z>1||q.z<-1)return 9;mx=Math.max(mx,Math.abs(q.x),Math.abs(q.y))}return mx};
  let lo=fitDist*.05,hi=fitDist*6;for(let i=0;i<30;i++){const mid=(lo+hi)/2;if(ext(mid)>m)lo=mid;else hi=mid}
  controls.target.copy(C);ext(hi);fitDist=hi;controls.update()}
window.__ARM={DEFS,build,select,tight};
})();
